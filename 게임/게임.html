<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 정본 340 — 휴대폰 화면 맞춤: 이 줄이 없으면 아이폰·아이패드가 화면을 980 폭으로 잡고 통째로 줄여 보여 줘 가상 패드가 아주 작아지고 그림도 쓸데없이 크게 그린다(아이패드 미니6 신고 창 980×472) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>창세기전 2 — 전체 실행기 (U0 셸 골격)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ddd;
               font-family: 'Malgun Gothic', sans-serif; }
  #무대 { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  /* ★★★ 창 크기를 사용자가 조절한다 (사용자 지정 2026-08-20: 「전투화면처럼
     창 크기는 사용자가 늘였다 줄였다 조정할 수 있게 할거야」).
     크기는 JS 가 정한다 — **8:5 비율(320:200)을 지키며** 창에 꽉 채운다. */
  #판 { background: #000; border: 1px solid #000; position: relative; }   /* 정본 335 — 테두리선이 화면 끝에 회색 줄로 보였다(아이폰 «좌측 위·우측 아래 선» · 전투 턴 바 아래 줄) · 두께는 그대로(크기 셈이 이 1px 을 안다) */
  /* ★ 캔버스는 판을 꽉 채운다. **백킹스토어 해상도는 JS 가 따로 잡는다** —
       좌표 계산은 언제나 논리 320×200 이다. */
  /* ☠★★★★★ **점을 뭉개지 않는다** (2026-09-09 · O12 · R160)
       ctx.imageSmoothingEnabled = false 는 **캔버스 안에 그릴 때**만 듣는다.
       캔버스를 **화면에 낼 때**는 CSS 가 정하는데 그것이 빠져 있었다.
       실측 — 같은 화면인데 캔버스 안은 101색(전부 원본 팔레트 색)인데
              화면에서는 735색(그중 팔레트 색 38개)이 됐다.
       원본(js-dos)은 판 640×400 = 표시 640×400 에 pixelated 다.
       ☐ 우리는 판 1292×800 을 표시 1264×784 로 **줄이는 것**이 남아 있다 —
         그것까지 고치면 화면 크기가 바뀌어 다른 창들의 대조가 흔들리므로
         여기서는 **뭉개지 않는 것만** 한다. 근거: 03_분석/_보관/끝난조사/00_지금조사_기타.md
       ☠ 두 줄 순서가 중요하다 — **뒤엣것이 이긴다.** 원본이 쓰는 pixelated 를
         뒤에 둔다(crisp-edges 는 그것을 모르는 옛 브라우저 몫이다).
         실측 — 순서를 바꾸기 전에는 crisp-edges 가 먹고 있었다. */
  #화면 { width: 100%; height: 100%; display: block;
          image-rendering: crisp-edges; image-rendering: pixelated; }
  #본문 { position: absolute; left: 0; top: 0; width: 100%; }
  /* ★★★ **video 를 겹치지 않는다** — 캔버스에 `drawImage` 로 그린다.
     겹쳐 두면 쌓임 순서·오버레이 합성 때문에 안 보이는 경우가 있었다
     (사용자 지적 2026-08-20: 「화면 재생 안돼」).
     캔버스에 그리면 **커서·진단도 그 위에** 그대로 얹히고 좌표계도 하나로 간다.
     ★ 화면 밖에 두되 `display:none` 은 **안 쓴다** — 그러면 디코딩이 멈춘다. */
  #영상 { position: fixed; left: -9999px; top: 0; width: 320px; height: 200px;
          opacity: 0; pointer-events: none; }
  #진단 { position: fixed; right: 8px; top: 8px; font-size: 12px; line-height: 1.5;
          background: rgba(0,0,0,.7); padding: 8px 10px; border: 1px solid #333; white-space: pre; }
  /* ★ 개발용 스케일러 고르개 — **기본은 감춤**이다 (진단칸과 같은 규칙 · §F-3·§B-3) */
  /* ★ 2026-09-24 (Z-41) 전투 패널(`battle_stage.css #panel`)과 같은 모양·자리 — 하단 가운데 */
  #개발도구 { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
              background: #1a1622ee; border: 1px solid #4b3f5e; border-radius: 4px;
              padding: 8px 10px; font-size: 12px; line-height: 1.9; z-index: 90; color: #b9aecd; }
  #개발도구 label { display: block; color: #b9aecd; }
  #개발도구 select { font-size: 12px; margin-left: 6px; }
  #개발도구 .devhdr { cursor: pointer; color: #ffd45a; font-weight: bold; user-select: none; }
  #개발도구 .foldbtn { float: right; margin-left: 12px; color: #b9aecd; }
  #셸개발몸.접힘 { display: none; }
  /* [리마스터 편의] 개발 패널 하나로 — 전투 패널(#panel)을 셸 패널 안 «전투» 칸에 넣는다 (2026-11-05 사장님 「개발도구 전투와 월드(마을 포함) 통합해줘. 계속 바뀌어서 불편해.」) */
  #개발도구 { max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; }
  #개발도구 #panel.셸안 { position: static; transform: none; left: auto; bottom: auto; max-height: none; overflow: visible;
                          border: 0; border-top: 1px solid #443a58; border-radius: 0; background: none; padding: 6px 0 0; margin-top: 4px; z-index: auto; }
  #개발도구 #panel.셸안 > .devhdr:first-child { cursor: pointer !important; }   /* 전투 머리는 «전투 칸» 접기 · ↗ 창 분리만 — 끌기는 셸 칸이 안 움직이므로 뜻이 없다 */
  #개발도구 #panel.셸안 > .devhdr:first-child::before { content: "전투 "; }
  #본문 { padding: 16px; font-size: 14px; line-height: 1.7; }
  .고름 { color: #ffd75f; }
  .안내 { color: #888; font-size: 12px; margin-top: 12px; }
  .탈 { color: #ff8080; }
</style>
</head>
<body>

<div id="무대"><div id="판">
  <!-- ★★★ 원본 화면은 **320×200** 이다. 캔버스를 그 크기로 두고 CSS 로만 확대한다
       (계획 §5-c — 원본 좌표계로 계산하고 출력에서 확대). -->
  <canvas id="화면" width="320" height="200"></canvas>
  <!-- ★★★ **오프닝 영상** — 리마스터 모드에서 원작 `.FLI` 대신 튼다.
       캔버스 위에 겹쳐 두고 오프닝 동안만 보인다. 캔버스에 매 프레임 복사하지
       않으므로 화질·성능이 그대로다. 창 크기는 판을 따라간다. -->
  <video id="영상" playsinline preload="auto"></video>
  <div id="본문">불러오는 중…</div>
</div></div>
<div id="진단"></div>
<!-- ★★★★★ **스케일러 고르개를 셸로 올렸다** (2026-09-22 · §B-3)
     > 사장님: 「개발 도구가 전투말고 **월드나 마을 등 다른 곳에서도 범용으로 사용**이
     >  가능해야해.」
     ☠ 전에는 `battle_stage.js` 의 **전투 개발 패널** 안에만 있어서 월드·마을에서는
       고를 길이 아예 없었다(엔진은 §B-1 로 이미 공용이 됐다).
     ★ 기본은 **감춤**이다 — `?진단`(또는 `?diag`·`?scaler고르개`) 이나
       콘솔 `__개발도구보기(true)` 로만 뜬다 (§F-3 과 같은 규칙). -->
<!-- ★★★★★ **개발툴 통합 — 모든 화면에서 뜬다** (2026-09-24 · Z-41)
     > 사장님: 「개발툴이 전투에만 떠서 마을이나 월드에서는 스케일러등 테스트가 불가능한 문제.
     >  개발툴 통합해서 모든 창에서 띄울 수 있어야함.」
     ☠ B-3 에서 이 칸을 만들고 **기본 감춤**으로 두어 사장님이 열 길이 없었다(콘솔·주소만).
     ★ 전투 패널(`battle_stage.js #panel`)과 **같은 모양·같은 자리**(하단 가운데 · 「개발」 헤더 접기)로
       모든 화면에 띄운다. 전투 무대가 서면 그 패널에 같은 고르개가 있으므로 **이 칸은 물러난다**
       — 화면에 개발툴은 늘 하나다.
     ★ 2026-11-05 바뀜 — 물러나지 않는다. 전투 패널을 이 칸 안 «셸전투칸» 으로 옮겨 넣는다(아래 보이기맞추기). 끄는 길: 주소 `?개발도구=0` · 콘솔 `__개발도구보기(false)`. -->
<div id="개발도구" style="display:none">
  <div class="devhdr" id="셸개발머리">개발<span class="foldbtn">▲</span></div>
  <div id="셸개발몸">
  <label>스케일러 <select id="셸스케일러고르개"></select></label>
  <!-- ★★★★★ **화면비 고르개** (2026-09-23 · §A-1 남은 것)
       §A-1 에서 화면비를 4:3·16:9 **두 가지로 고정**해 두고 «고르는 자리»가 없어
       `G2Opt.설정('화면비','16:9')` 를 콘솔에 쳐야만 바뀌었다.
       ★ 스케일러 고르개와 **같은 칸**에 둔다 — §A-1 이 「§2 B-3 고르개 작업과 함께
         한다」고 적어 둔 그대로다. 원본 OPTION 화면은 **안 건드린다**(원작에 없는 항목). -->
  <label>화면비 <select id="셸화면비고르개"></select></label>
  <label>게임 배속 <select id="셸배속고르개"></select></label>   <!-- [리마스터 편의] 2026-10-07 · opt.js 배속 -->
  <!-- [리마스터 편의] 마을 실내 벽 내리기 (11-05 사장님 「지금 마을 벽내리기 옵션도 추가했어. 이부분도 개발도구에 넣어야해」) · town3d.js G2마을3D.벽내리기 — 기억은 그쪽(localStorage 실내벽내리기) -->
  <label title="마을 실내 맵에서 인물 앞을 가리는 벽을 어떻게 내릴지 고릅니다. 야외 맵에는 걸리지 않습니다.">실내 벽 내리기 <select id="셸벽내리기고르개"><option value="끔">벽내리기 끄기</option><option value="화면">하단 벽 내리기</option><option value="전체">전체 벽 내리기</option></select></label>

  <!-- [리마스터 개발] 전투 고르기 (11-07 사장님 「마을은 언제든지 진입이 가능해 … 그런데 전투는 전투에 진입한 이후에만 진입이 가능한 문제가 있어」) · /시나리오목록 · 시작화면·월드·마을·전투 어디서든 -->
  <label title="고르면 그 시나리오 전투로 바로 들어갑니다. 시작화면·월드·마을·전투 어디서든 됩니다. 이름 앞 숫자가 있는 시나리오는 그 장의 파티로 바꿉니다.">전투 이동 <select id="셸전투고르개"><option value="">— 전투 고르기 —</option></select></label>
  <label title="대사가 다 나오면 잠시 뒤 저절로 넘어갑니다(A 키로도 켜고 끔). Shift 를 누르고 있으면 대사를 곧바로 넘기고 4배로 빨리 감습니다. 선택지는 직접 고릅니다.">이벤트 자동 진행 <input type="checkbox" id="셸이벤트자동"></label>   <!-- [리마스터 편의] 2026-10-07 · opt.js 이벤트자동 -->
  <div id="맵U편집초안" style="display:none" title="명시 로컬 MAP 증명 전용. U 값을 복사하거나 저장·표시하지 않습니다.">
    <form id="맵U편집입력" onsubmit="return false">
